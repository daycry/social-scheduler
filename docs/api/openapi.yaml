openapi: 3.0.3
info:
  title: Social Scheduler API v1
  version: 1.0.0
  description: "API v1 única de la aplicación (publicaciones, marcas, cuentas, media, buzón, informes, estadísticas, SmartLinks, sitios, diseños nativos por marca, IA, Canva y flujo de trabajo). Convenciones comunes: la marca va siempre en la ruta (`/brands/{brand}/…`), los listados nuevos usan el contrato de paginación por cursor (`limit`, `cursor`, `has_more`, `next_cursor`), los errores son JSON (`message` y, en validación, `errors`) y el 429 va en castellano con `Retry-After`. Contrato de diseños nativos por marca, IA, Canva, publicaciones y flujo de trabajo (aprobaciones, series, lotes, colaboradores, publicación manual y reintento). UI y MCP usan los mismos servicios. Las exportaciones identifican una revisión concreta."
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /brands/{brand}/datasets:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
    get:
      operationId: "listStudioDatasets"
      description: "designs:read. Metadata only, literal search, owner and brand scoped."
      parameters:
        - {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}
        - {"name": "per_page", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 25}}
        - {"name": "query", "in": "query", "schema": {"type": "string", "maxLength": 120}}
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetList"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: "createStudioDataset"
      description: "designs:write. Fixed server dataset profile; private immutable revision1. Unknown keys rejected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioDatasetCreate"
      responses:
        201:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "getStudioDataset"
      description: "designs:read. Safe metadata; archived resources retain historical reads."
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
    put:
      operationId: "replaceStudioDataset"
      description: "designs:write. Atomic expected revision; archived resource cannot be edited."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioDatasetReplace"
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        409:
          description: "Revision changed; no mutation or orphan"
    delete:
      operationId: "archiveStudioDataset"
      description: "designs:write. Reversible archive, no table revision or file deletion."
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/restore:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    post:
      operationId: "restoreStudioDataset"
      description: "designs:write. Restore same resource, preserving all immutable revisions."
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/revisions:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "listStudioDatasetRevisions"
      description: "designs:read. Metadata history only, no private storage paths or table payload."
      parameters:
        - {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}
        - {"name": "per_page", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 25}}
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetRevisionList"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/table:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "getStudioDatasetRows"
      description: "designs:read. Capture immutable revision before I/O. At most6MiB UTF8 row payload; next_offset is exact when fewer than limit fit. No cell truncation or skipped rows."
      parameters:
        - {"name": "revision", "in": "query", "schema": {"type": "integer", "minimum": 1}}
        - {"name": "offset", "in": "query", "schema": {"type": "integer", "minimum": 0, "maximum": 1000, "default": 0}}
        - {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetRows"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        503:
          description: "Private snapshot missing or corrupt; no fallback"
  /brands/{brand}/datasets/import:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
    post:
      operationId: "createStudioDatasetFromFile"
      description: "designs:write. MultipartCSV/TSV25,000,000B or typedJSON52,000,000B. Fixed format budgets; no URLs/paths. JSON rejects header option. XLSX not implemented by this operation."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudioDatasetFileCreate"
      responses:
        201:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/import:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    post:
      operationId: "replaceStudioDatasetFromFile"
      description: "designs:write. MultipartCSV/TSV25,000,000B or typedJSON52,000,000B. Fixed format budgets; no URLs/paths. JSON rejects header option. XLSX not implemented by this operation."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudioDatasetFileReplace"
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        409:
          description: "Revision changed; no mutation"
  /brands/{brand}/datasets/{dataset}/export:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "exportStudioDataset"
      description: "designs:read. Private streamed attachment. CSV/TSV default spreadsheet prefixes every string including labels; text mode preserves lexical content and may be interpreted by external spreadsheets. JSON preserves types and identities; mode/header options incompatible withJSON are rejected."
      parameters:
        - {"name": "revision", "in": "query", "schema": {"type": "integer", "minimum": 1}}
        - {"name": "format", "in": "query", "schema": {"type": "string", "enum": ["csv", "tsv", "json"], "default": "csv"}}
        - {"name": "mode", "in": "query", "schema": {"type": "string", "enum": ["spreadsheet", "text"]}}
        - {"name": "header", "in": "query", "schema": {"type": "boolean", "default": true}}
      responses:
        200:
          description: "PrivateUTF8 attachment with generated filename, no-store and nosniff"
          content:
            text/csv:
              schema:
                type: "string"
            text/tab-separated-values:
              schema:
                type: "string"
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetTable"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs:read"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        503:
          description: "Snapshot unavailable or corrupt; no fallback"
  /designs/{design}/captions:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: getStudioCaptions
      description: designs:read. Snapshot revision, paginated cues, maximum100 per page. No implicit conversion.
      parameters:
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 5001, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: "Revision, optional caption style, cues and pagination", content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      operationId: mutateStudioCaptions
      description: designs:write. Atomic optimistic revision. Import, replace, upsert, delete, offset, style or clear. v1 requires explicit temporal activation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptionMutation' }
      responses:
        '200': { description: Saved revision and paginated caption state, content: { application/json: { schema: { type: object } } } }
        '409': { description: Revision conflict; no change }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/captions/export:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: exportStudioCaptions
      description: designs:read. Private plain SRT or WebVTT snapshot; no media export job, ASR or translation.
      parameters:
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [srt, vtt] } }
      responses:
        '200': { description: UTF-8 caption attachment, content: { text/plain: { schema: { type: string } }, text/vtt: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/designs:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioDesigns
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: folder_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: templates
          in: query
          schema: { type: boolean }
        - name: archived
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: "Página de diseños (24 por defecto; los más recientes primero por id) con el contrato de cursor común", content: { application/json: { schema: { $ref: '#/components/schemas/DesignPage' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesign' }
      responses:
        '201': { description: Diseño creado con revisión inicial, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: getStudioDesign
      parameters:
        - name: exports_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: "Documento, revisión, recursos privados y exportaciones", content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDesign' }
      responses:
        '200': { description: Nueva revisión guardada, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '409': { description: La revisión esperada ya no es actual, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: archiveStudioDesign
      responses:
        '200': { description: Diseño archivado sin borrar versiones ni exportaciones }
        '404': { $ref: '#/components/responses/NotFound' }
  /designs/{design}/template:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: saveStudioTemplate
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCopy' }
      responses:
        '201': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/instantiate:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: instantiateStudioTemplate
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantiateTemplate' }
      responses:
        '201': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/resize:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: resizeStudioDesign
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResizeDesign' }
      responses:
        '200': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/apply-kit:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: applyStudioBrandKit
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedRevision' }
      responses:
        '200': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/variants:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: createStudioVariants
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignVariants' }
      responses:
        '201': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResults' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: duplicateStudioDesign
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '201': { description: Copia independiente, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /designs/{design}/restore:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: restoreStudioDesign
      responses:
        '200': { description: Diseño restaurado, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-folders:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioFolders
      responses:
        '200':
          description: Carpetas de la marca; requiere designs:read
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { $ref: '#/components/schemas/DesignFolder' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStudioFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: Carpeta creada; requiere designs:write
          content:
            application/json:
              schema:
                type: object
                required: [folder]
                properties:
                  folder: { $ref: '#/components/schemas/DesignFolder' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-folders/{folder}:
    parameters:
      - name: folder
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteStudioFolder
      responses:
        '200':
          description: Carpeta eliminada; conserva diseños activos y archivados sin asociación; requiere designs:write
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/brand-kit:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getStudioBrandKit
      responses:
        '200': { description: Kit de la marca, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateStudioBrandKit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandKit' }
      responses:
        '200': { description: Kit guardado, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-assets:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioAssets
      responses:
        '200': { description: Recursos registrados en la marca; las URLs privadas se regeneran al consultar }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: attachStudioAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id]
              properties:
                media_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: Recurso propio listo registrado en la marca }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/exports:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: listStudioExports
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Historial paginado de trabajos y resultados de exportación
          content:
            application/json:
              schema:
                type: object
                required: [exports, pagination]
                properties:
                  exports: { type: array, items: { $ref: '#/components/schemas/Export' } }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: exportStudioDesign
      description: Exporta una revisión inmutable. MP4/GIF generan un archivo del proyecto con páginas en el orden indicado; frame_times no vacío y transparencia no se admiten para esos formatos. Los handlers audiovisuales del árbol de trabajo usan la cola studio; el diálogo del editor utiliza esos mismos trabajos y ofrece seguimiento y controles. La QA integral del padre T-11 sigue pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, format, pages]
              properties:
                revision: { type: integer, minimum: 1 }
                format: { type: string, enum: [png, jpeg, webp, svg, pdf, mp4, gif] }
                pages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, maxLength: 64 }
                frame_times:
                  $ref: '#/components/schemas/FrameTimes'
                scale: { type: number, minimum: 0.1, maximum: 4, default: 1 }
                quality: { type: number, minimum: 0.1, maximum: 1, default: 0.94 }
                transparent: { type: boolean, default: false, description: Transparencia de formatos estáticos compatibles; MP4/GIF requieren false }
      responses:
        '202': { description: Trabajo de render aceptado, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-exports/{export}:
    parameters:
      - name: export
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getStudioExport
      responses:
        '200': { description: Estado y archivos realmente producidos, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /design-exports/{export}/cancel:
    parameters:
      - { name: export, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: cancelStudioExport
      description: Requiere designs:write y propiedad de exportación/marca. Cancela pending/processing audiovisual y señala su proceso; repetir cancelled es idempotente. Ready devuelve409 y conserva sus medios. Formatos estáticos devuelven422.
      responses:
        '200': { description: Estado cancelado sin aceptar respuestas tardías, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El resultado listo se conserva; no admite cancelación }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Cancelación registrada pero no se pudo señalizar el proceso; consultar estado y reintentar la señalización }
  /design-exports/{export}/retry:
    parameters:
      - { name: export, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: retryStudioExport
      description: Requiere designs:write y propiedad de exportación/marca. Solo failed/cancelled audiovisual; conserva revisión/opciones, crea generación nueva y valida los checkpoints antes de reutilizarlos. El ID público no cambia. Pending/processing/ready devuelve409; estáticos422.
      responses:
        '202': { description: Nueva generación aceptada, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El estado actual no admite reintento }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-exports/{export}/post:
    parameters:
      - { name: export, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: createPostFromStudioExport
      description: Requiere designs:write y posts:write. Crea solo un borrador en la marca de la exportación propia ready, usando todos sus medios realmente listos. Nunca programa ni publica. SVG/PDF no son medios publicables.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, nullable: true, maxLength: 100000 }
                targets: { type: array, items: { type: object } }
      responses:
        '201':
          description: Borrador propio creado sin publicar
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    type: object
                    required: [id, status, edit_url]
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [borrador] }
                      edit_url: { type: string }
        '403': { description: Falta alguno de los permisos requeridos }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/analytics:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getBrandAnalytics
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: network
          in: query
          schema: { type: string }
      responses:
        '200': { description: "Métricas, comparación y cobertura compatibles con dashboard; nulos preservados" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-fonts:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioFonts
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Fuentes privadas de la marca y paginación, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: uploadStudioFont
      description: Requiere designs:write. Parsea bytes TTF/OTF/WOFF/WOFF2 y normaliza WOFF2 privado; máximo 8 MiB de entrada y 32 MiB sfnt declarado. No acepta URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201': { description: Fuente validada y almacenada, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Ejecutor tipográfico no disponible }
  /brands/{brand}/design-fonts/{font}:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getStudioFont
      responses:
        '200': { description: Metadata privada sin rutas de disco, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteStudioFont
      description: Requiere designs:write. Una fuente referenciada por diseños, revisiones o kit no se elimina.
      responses:
        '204': { description: Fuente eliminada }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Fuente usada en un diseño, revisión o kit" }
  /brands/{brand}/design-fonts/{font}/file:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: downloadStudioFont
      responses:
        '200': { description: Bytes WOFF2 privados, content: { font/woff2: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-fonts/{font}/archive:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: archiveStudioFont
      responses:
        '200': { description: Oculta en catálogo activo conservando bytes y referencias históricas, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-fonts/{font}/restore:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: restoreStudioFont
      responses:
        '200': { description: Restaura visibilidad de una fuente archivada, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/image-jobs:
    parameters:
      - $ref: '#/components/parameters/Brand'
    post:
      operationId: createStudioImageJob
      description: Requiere designs:write. Procesa una imagen propia registrada en la marca sin modificar el original. Modelo local verificado; no descarga ni ejecuta código remoto durante el job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [media_id, operation]
              properties:
                media_id: { type: integer, minimum: 1 }
                operation: { type: string, enum: [remove_background] }
      responses:
        '202': { description: Trabajo creado o trabajo activo equivalente recuperado, content: { application/json: { schema: { $ref: '#/components/schemas/StudioImageJobResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/image-jobs/{job}:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - name: job
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getStudioImageJob
      description: Requiere designs:read y propiedad del trabajo dentro de la marca.
      responses:
        '200': { description: Estado y recurso de salida privado cuando está listo, content: { application/json: { schema: { $ref: '#/components/schemas/StudioImageJobResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-audio:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioAudio
      description: Audio de la marca, diseños read; búsqueda por nombre y paginación.
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Recursos de audio y paginación, content: { application/json: { schema: { type: object, properties: { assets: { type: array, items: { $ref: '#/components/schemas/StudioAudioAsset' } }, pagination: { type: object } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: startStudioAudioUpload
      description: designs:write. Inicia una subida binaria privada local o prefirmada single/multipart; no recibe base64 ni URLs de origen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStudioAudioUpload' }
      responses:
        '201': { description: Recurso pendiente y ticket de subida, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioUpload' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-audio/{media}:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - $ref: '#/components/parameters/Media'
    get:
      operationId: getStudioAudio
      description: designs:read; recurso de audio de la misma marca, incluido el estado pendiente o inválido.
      responses:
        '200': { description: Estado del audio, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-audio/{media}/upload:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - $ref: '#/components/parameters/Media'
    put:
      operationId: uploadStudioAudioLocal
      description: designs:write. Solo modo local, cuerpo binario acotado; sondeo real antes de ready. Una subida terminada no se sobrescribe.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { description: Audio sondeado y listo, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioResult' } } } }
        '409': { description: Subida ya terminada o concurrente }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Motor o preparación temporal no disponible; el archivo válido sigue pendiente para reintentar }
  /brands/{brand}/design-audio/{media}/complete:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - $ref: '#/components/parameters/Media'
    post:
      operationId: completeStudioAudioUpload
      description: designs:write. Finaliza single/multipart, valida bytes/contenido/sondeo y devuelve el estado. Idempotente si ya está listo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parts:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [number, etag]
                    properties:
                      number: { type: integer, minimum: 1, maximum: 10000 }
                      etag: { type: string, maxLength: 200 }
      responses:
        '200': { description: Audio validado, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioResult' } } } }
        '409': { description: Finalización concurrente }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Motor o copia privada no disponibles; la subida sigue pendiente }
  /brands:
    get:
      operationId: listBrands
      tags: [Marcas]
      description: "brands:read. Las marcas del usuario de la API key."
      responses:
        '200': { description: Marcas, content: { application/json: { schema: { type: object, required: [brands], properties: { brands: { type: array, items: { $ref: '#/components/schemas/BrandSummary' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /brands/{brand}:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getBrand
      tags: [Marcas]
      description: "brands:read. Una marca ajena responde 404."
      responses:
        '200': { description: Marca, content: { application/json: { schema: { $ref: '#/components/schemas/BrandSummary' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /brands/{brand}/accounts:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listBrandAccounts
      tags: [Marcas]
      description: "brands:read. Cuentas conectadas de la marca y los tipos de contenido (`content_type`) que admite cada una. Nunca expone tokens de las redes."
      responses:
        '200': { description: Cuentas, content: { application/json: { schema: { type: object, required: [brand_id, accounts], properties: { brand_id: { type: integer }, brand_name: { type: string }, accounts: { type: array, items: { $ref: '#/components/schemas/Account' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /brands/{brand}/posts:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listPosts
      tags: [Publicaciones]
      description: "posts:read. Publicaciones de la marca, las más recientes primero, con el contrato de cursor común."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { type: string, enum: [borrador, programada, publicando, procesando, publicada, fallida] } }
      responses:
        '200': { description: Página de publicaciones, content: { application/json: { schema: { $ref: '#/components/schemas/PostPage' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: createPost
      tags: [Publicaciones]
      description: "posts:write. Mismo contrato que el compositor web y el MCP (PostRequest). La marca va en la ruta. `media` es la media común y `targets[].media` la propia de cada destino (ausente o null = hereda la común)."
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostInput' } } } }
      responses:
        '201': { description: Publicación creada, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /posts/{post}/cancel:
    parameters: [{ $ref: '#/components/parameters/Post' }]
    post:
      operationId: cancelPost
      tags: [Publicaciones]
      description: "posts:write. Cancela la programación: la publicación pendiente vuelve a borrador y no se publicará. No la borra. Una que ya es borrador (ya cancelada) o ya se publicó responde 409."
      responses:
        '200': { description: Publicación en borrador, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /posts/{post}/publish:
    parameters: [{ $ref: '#/components/parameters/Post' }]
    post:
      operationId: publishPostNow
      tags: [Publicaciones]
      description: "posts:write. Publica ya un borrador o una programada: se valida como al programar (sin exigir fecha futura) y se encola de inmediato. El estado pasa a publicada cuando la red responde. Una publicación que se está publicando o ya se publicó responde 409."
      responses:
        '202': { description: Publicación encolada, content: { application/json: { schema: { $ref: '#/components/schemas/Post' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /media:
    get:
      operationId: listMedia
      tags: [Media]
      description: "brands:read. Media del usuario, la más reciente primero, con el contrato de cursor común. Por defecto solo la ya validada (`status=listo`) de tipo imagen y video (lo publicable); `kind=pdf` lista los PDF de la biblioteca, que no se publican en redes."
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - { name: status, in: query, schema: { type: string, enum: [listo, pendiente, invalido, todos], default: listo } }
        - { name: kind, in: query, schema: { type: string, enum: [image, video, pdf] } }
      responses:
        '200': { description: Página de media, content: { application/json: { schema: { $ref: '#/components/schemas/MediaPage' } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    post:
      operationId: initiateMediaUpload
      tags: [Media]
      description: "posts:write. Registra el fichero y devuelve cómo subirlo: `upload.mode` es `local` (PUT del binario a `upload.url`, la ruta de la API), `single` (PUT a una URL prefirmada) o `multipart` (partes prefirmadas y después `complete`)."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, mime, size], properties: { name: { type: string, maxLength: 255 }, mime: { type: string, maxLength: 100 }, size: { type: integer, minimum: 1 } } } } } }
      responses:
        '201': { description: Fichero registrado, content: { application/json: { schema: { type: object, required: [asset, upload], properties: { asset: { $ref: '#/components/schemas/MediaAsset' }, upload: { type: object, additionalProperties: true } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /media/import-url:
    post:
      operationId: importMediaFromUrl
      tags: [Media]
      description: "posts:write. Importa media desde una URL pública http/https. Devuelve el asset en estado `pendiente`: la descarga ocurre en segundo plano; consulta `GET /media/{asset}`. Se rechazan direcciones internas y credenciales en la URL. Máximo 3 importaciones en curso."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string, maxLength: 2048 } } } } } }
      responses:
        '202': { description: Importación en curso, content: { application/json: { schema: { type: object, required: [asset], properties: { asset: { $ref: '#/components/schemas/MediaAsset' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /media/{asset}:
    parameters: [{ $ref: '#/components/parameters/Asset' }]
    get:
      operationId: getMedia
      tags: [Media]
      description: "brands:read. Estado de un fichero (sondea el progreso de una importación). Uno ajeno responde 404."
      responses:
        '200': { description: Fichero, content: { application/json: { schema: { type: object, required: [asset], properties: { asset: { $ref: '#/components/schemas/MediaAsset' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteMedia
      tags: [Media]
      description: "posts:write. Borra un fichero propio que no esté en uso (en uso responde 409)."
      responses:
        '200': { description: Borrado, content: { application/json: { schema: { type: object, properties: { id: { type: integer }, deleted: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /media/{asset}/upload:
    parameters: [{ $ref: '#/components/parameters/Asset' }]
    put:
      operationId: uploadMediaBinary
      tags: [Media]
      description: "posts:write. Solo con almacenamiento local (`upload.mode=local`): el cuerpo es el binario. Con R2/S3 se sube directo a las URLs prefirmadas."
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        '200': { description: Fichero validado, content: { application/json: { schema: { type: object, required: [asset], properties: { asset: { $ref: '#/components/schemas/MediaAsset' } } } } } }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/MissingAbility' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /media/{asset}/complete:
    parameters: [{ $ref: '#/components/parameters/Asset' }]
    post:
      operationId: completeMediaUpload
      tags: [Media]
      description: "posts:write. Cierra la subida (multipart) y extrae los metadatos. Responde 422 con el asset si el fichero no es válido."
