# Ajustes de Nginx para Social Scheduler en HestiaCP.
#
# Instalacion (como root o con sudo), con <USUARIO> y <DOMINIO> del dominio en Hestia:
#   cp deploy/hestia/nginx-overrides.conf /home/<USUARIO>/conf/web/<DOMINIO>/nginx.conf_letsencrypt  # HTTP
#   cp deploy/hestia/nginx-overrides.conf /home/<USUARIO>/conf/web/<DOMINIO>/nginx.ssl.conf_custom   # HTTPS
#   v-rebuild-web-domain <USUARIO> <DOMINIO> && systemctl reload nginx
# (Hestia incluye automaticamente los ficheros *.conf_* de ese directorio; el nombre exacto
#  puede variar segun la version de Hestia: ver deploy/hestia/README.md.)

# Subida de media grande: las subidas de video van a R2 por URL prefirmada (T-17),
# pero se deja margen para formularios con imagenes y para el flujo de reintento.
client_max_body_size 64m;
client_body_timeout 120s;

# Cabeceras de seguridad basicas
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Ficheros ocultos y .env nunca se sirven
location ~ /\.(?!well-known) {
    deny all;
}

# Healthcheck de Laravel (HTTP 200), sin logs para no ensuciar el access log
location = /up {
    access_log off;
    try_files $uri /index.php?$query_string;
}

# OAuth del MCP (ADR-004): los metadatos /.well-known/oauth-* los sirve Laravel. El `^~` evita que otra location de
# Hestia (p. ej. /.well-known/acme-challenge o un regex de ficheros estaticos) los capture y devuelva 404.
location ^~ /.well-known/oauth- {
    try_files $uri /index.php?$query_string;
}
