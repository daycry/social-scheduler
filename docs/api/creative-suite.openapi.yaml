openapi: 3.0.3
info:
  title: Creative Social Suite API
  version: 1.0.0
  description: Contrato de diseños nativos por marca. UI y MCP usan los mismos servicios. Las exportaciones identifican una revisión concreta.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /brands/{brand}/designs:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioDesigns
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: folder_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: templates
          in: query
          schema: { type: boolean }
        - name: archived
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: Diseños de la marca y paginación, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesign' }
      responses:
        '201': { description: Diseño creado con revisión inicial, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: getStudioDesign
      parameters:
        - name: exports_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: Documento, revisión, recursos privados y exportaciones, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDesign' }
      responses:
        '200': { description: Nueva revisión guardada, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '409': { description: La revisión esperada ya no es actual, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: archiveStudioDesign
      responses:
        '200': { description: Diseño archivado sin borrar versiones ni exportaciones }
        '404': { $ref: '#/components/responses/NotFound' }
  /designs/{design}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: duplicateStudioDesign
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '201': { description: Copia independiente, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /designs/{design}/restore:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: restoreStudioDesign
      responses:
        '200': { description: Diseño restaurado, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-folders:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioFolders
      responses:
        '200':
          description: Carpetas de la marca; requiere designs:read
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { $ref: '#/components/schemas/DesignFolder' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStudioFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: Carpeta creada; requiere designs:write
          content:
            application/json:
              schema:
                type: object
                required: [folder]
                properties:
                  folder: { $ref: '#/components/schemas/DesignFolder' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-folders/{folder}:
    parameters:
      - name: folder
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteStudioFolder
      responses:
        '200':
          description: Carpeta eliminada; conserva diseños activos y archivados sin asociación; requiere designs:write
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/brand-kit:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getStudioBrandKit
      responses:
        '200': { description: Kit de la marca, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateStudioBrandKit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandKit' }
      responses:
        '200': { description: Kit guardado, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-assets:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioAssets
      responses:
        '200': { description: Recursos registrados en la marca; las URLs privadas se regeneran al consultar }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: attachStudioAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id]
              properties:
                media_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: Recurso propio listo registrado en la marca }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/exports:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: listStudioExports
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Historial paginado de trabajos y resultados de exportación
          content:
            application/json:
              schema:
                type: object
                required: [exports, pagination]
                properties:
                  exports: { type: array, items: { $ref: '#/components/schemas/Export' } }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: exportStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, format, pages]
              properties:
                revision: { type: integer, minimum: 1 }
                format: { type: string, enum: [png, jpeg, webp, svg, pdf] }
                pages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, maxLength: 64 }
      responses:
        '202': { description: Trabajo de render aceptado, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-exports/{export}:
    parameters:
      - name: export
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getStudioExport
      responses:
        '200': { description: Estado y archivos realmente producidos, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/analytics:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getBrandAnalytics
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: network
          in: query
          schema: { type: string }
      responses:
        '200': { description: Métricas, comparación y cobertura compatibles con dashboard; nulos preservados }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Brand: { name: brand, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Design: { name: design, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    NotFound:
      description: Recurso inexistente o ajeno
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Documento, permiso de recurso o parámetros incompatibles
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: true }
    Document:
      type: object
      required: [schema_version, width, height, pages]
      properties:
        schema_version: { type: integer, enum: [1] }
        width: { type: integer, minimum: 40, maximum: 8000 }
        height: { type: integer, minimum: 40, maximum: 8000 }
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, background, elements]
            properties:
              id: { type: string, maxLength: 64 }
              name: { type: string, maxLength: 255 }
              background: { oneOf: [{ type: string }, { type: object }] }
              duration: { type: number, minimum: 0.1, maximum: 3600 }
              elements:
                type: array
                maxItems: 500
                items:
                  type: object
                  required: [id, type, x, y, width, height]
                  properties:
                    id: { type: string, maxLength: 64 }
                    type: { type: string, enum: [text, rect, ellipse, triangle, line, path, image, video, group] }
                    x: { type: number }
                    y: { type: number }
                    width: { type: number, minimum: 0 }
                    height: { type: number, minimum: 0 }
                    asset_id: { type: integer, minimum: 1 }
                    elements: { type: array, items: { type: object } }
    CreateDesign:
      type: object
      required: [name, document]
      properties:
        name: { type: string, maxLength: 255 }
        document: { $ref: '#/components/schemas/Document' }
        folder_id: { type: integer, nullable: true, minimum: 1 }
        is_template: { type: boolean }
    UpdateDesign:
      allOf:
        - $ref: '#/components/schemas/CreateDesign'
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 1 }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total, has_more]
      properties:
        current_page: { type: integer, minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    Design:
      allOf:
        - $ref: '#/components/schemas/CreateDesign'
        - type: object
          required: [id, brand_id, revision]
          properties:
            id: { type: integer }
            brand_id: { type: integer }
            revision: { type: integer, minimum: 1 }
            exports: { type: array, items: { $ref: '#/components/schemas/Export' } }
            exports_pagination: { $ref: '#/components/schemas/PaginationMeta' }
    DesignFolder:
      type: object
      required: [id, brand_id, name]
      properties:
        id: { type: integer }
        brand_id: { type: integer }
        name: { type: string, maxLength: 255 }
    BrandKit:
      type: object
      properties:
        palette: { type: array, maxItems: 50, items: { type: string } }
        fonts: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
        logos: { type: array, maxItems: 30, items: { type: integer, minimum: 1 } }
        guidelines: { type: string, nullable: true, maxLength: 10000 }
        voice: { type: string, nullable: true, maxLength: 5000 }
    Export:
      type: object
      required: [id, design_id, revision, status, format]
      properties:
        id: { type: integer }
        design_id: { type: integer }
        revision: { type: integer }
        status: { type: string, enum: [pending, processing, ready, failed] }
        format: { type: string, enum: [png, jpeg, webp, svg, pdf] }
        pages: { type: array, items: { type: string } }
        media_ids: { type: array, nullable: true, items: { type: integer } }
        options: { type: object, nullable: true }
        error: { type: string, nullable: true }
        download_url: { type: string, nullable: true, description: URL firmada de descarga válida durante 10 minutos; null hasta disponer de artefacto listo }
