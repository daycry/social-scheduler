# Nivel http (/etc/nginx/conf.d/): `map` no se admite dentro de `server`. Lo usa nginx-overrides.conf.
# Si la respuesta de PHP ya trae Referrer-Policy, la variable queda vacia y Nginx no anade la suya (sin duplicados).
map $upstream_http_referrer_policy $referrer_policy_default {
    default "";
    ""      "strict-origin-when-cross-origin";
}
