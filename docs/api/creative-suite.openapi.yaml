openapi: 3.0.3
info:
  title: Creative Social Suite API
  version: 1.0.0
  description: Contrato de diseños nativos por marca. UI y MCP usan los mismos servicios. Las exportaciones identifican una revisión concreta.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /brands/{brand}/datasets:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
    get:
      operationId: "listStudioDatasets"
      description: "designs:read. Metadata only, literal search, owner and brand scoped."
      parameters:
        - {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}
        - {"name": "per_page", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 25}}
        - {"name": "query", "in": "query", "schema": {"type": "string", "maxLength": 120}}
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetList"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
    post:
      operationId: "createStudioDataset"
      description: "designs:write. Fixed server dataset profile; private immutable revision1. Unknown keys rejected."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioDatasetCreate"
      responses:
        201:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "getStudioDataset"
      description: "designs:read. Safe metadata; archived resources retain historical reads."
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
    put:
      operationId: "replaceStudioDataset"
      description: "designs:write. Atomic expected revision; archived resource cannot be edited."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioDatasetReplace"
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        409:
          description: "Revision changed; no mutation or orphan"
    delete:
      operationId: "archiveStudioDataset"
      description: "designs:write. Reversible archive, no table revision or file deletion."
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/restore:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    post:
      operationId: "restoreStudioDataset"
      description: "designs:write. Restore same resource, preserving all immutable revisions."
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/revisions:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "listStudioDatasetRevisions"
      description: "designs:read. Metadata history only, no private storage paths or table payload."
      parameters:
        - {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "default": 1}}
        - {"name": "per_page", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 25}}
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetRevisionList"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/table:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "getStudioDatasetRows"
      description: "designs:read. Capture immutable revision before I/O. At most6MiB UTF8 row payload; next_offset is exact when fewer than limit fit. No cell truncation or skipped rows."
      parameters:
        - {"name": "revision", "in": "query", "schema": {"type": "integer", "minimum": 1}}
        - {"name": "offset", "in": "query", "schema": {"type": "integer", "minimum": 0, "maximum": 1000, "default": 0}}
        - {"name": "limit", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 100, "default": 50}}
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetRows"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        503:
          description: "Private snapshot missing or corrupt; no fallback"
  /brands/{brand}/datasets/import:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
    post:
      operationId: "createStudioDatasetFromFile"
      description: "designs:write. MultipartCSV/TSV25,000,000B or typedJSON52,000,000B. Fixed format budgets; no URLs/paths. JSON rejects header option. XLSX not implemented by this operation."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudioDatasetFileCreate"
      responses:
        201:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
  /brands/{brand}/datasets/{dataset}/import:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    post:
      operationId: "replaceStudioDatasetFromFile"
      description: "designs:write. MultipartCSV/TSV25,000,000B or typedJSON52,000,000B. Fixed format budgets; no URLs/paths. JSON rejects header option. XLSX not implemented by this operation."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudioDatasetFileReplace"
      responses:
        200:
          description: "Private dataset result"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetEnvelope"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs ability"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        409:
          description: "Revision changed; no mutation"
  /brands/{brand}/datasets/{dataset}/export:
    parameters:
      - {"$ref": "#/components/parameters/Brand"}
      - {"name": "dataset", "in": "path", "required": true, "schema": {"type": "integer", "minimum": 1}}
    get:
      operationId: "exportStudioDataset"
      description: "designs:read. Private streamed attachment. CSV/TSV default spreadsheet prefixes every string including labels; text mode preserves lexical content and may be interpreted by external spreadsheets. JSON preserves types and identities; mode/header options incompatible withJSON are rejected."
      parameters:
        - {"name": "revision", "in": "query", "schema": {"type": "integer", "minimum": 1}}
        - {"name": "format", "in": "query", "schema": {"type": "string", "enum": ["csv", "tsv", "json"], "default": "csv"}}
        - {"name": "mode", "in": "query", "schema": {"type": "string", "enum": ["spreadsheet", "text"]}}
        - {"name": "header", "in": "query", "schema": {"type": "boolean", "default": true}}
      responses:
        200:
          description: "PrivateUTF8 attachment with generated filename, no-store and nosniff"
          content:
            text/csv:
              schema:
                type: "string"
            text/tab-separated-values:
              schema:
                type: "string"
            application/json:
              schema:
                $ref: "#/components/schemas/StudioDatasetTable"
        401:
          description: "Authentication required"
        403:
          description: "Missing designs:read"
        404:
          $ref: "#/components/responses/NotFound"
        422:
          $ref: "#/components/responses/ValidationError"
        503:
          description: "Snapshot unavailable or corrupt; no fallback"
  /designs/{design}/captions:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: getStudioCaptions
      description: designs:read. Snapshot revision, paginated cues, maximum100 per page. No implicit conversion.
      parameters:
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 5001, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: Revision, optional caption style, cues and pagination, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      operationId: mutateStudioCaptions
      description: designs:write. Atomic optimistic revision. Import, replace, upsert, delete, offset, style or clear. v1 requires explicit temporal activation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptionMutation' }
      responses:
        '200': { description: Saved revision and paginated caption state, content: { application/json: { schema: { type: object } } } }
        '409': { description: Revision conflict; no change }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/captions/export:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: exportStudioCaptions
      description: designs:read. Private plain SRT or WebVTT snapshot; no media export job, ASR or translation.
      parameters:
        - { name: revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [srt, vtt] } }
      responses:
        '200': { description: UTF-8 caption attachment, content: { text/plain: { schema: { type: string } }, text/vtt: { schema: { type: string } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/designs:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioDesigns
      parameters:
        - name: query
          in: query
          schema: { type: string, maxLength: 120 }
        - name: folder_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: templates
          in: query
          schema: { type: boolean }
        - name: archived
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: Diseños de la marca y paginación, content: { application/json: { schema: { type: object } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDesign' }
      responses:
        '201': { description: Diseño creado con revisión inicial, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: getStudioDesign
      parameters:
        - name: exports_page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200': { description: Documento, revisión, recursos privados y exportaciones, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateStudioDesign
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDesign' }
      responses:
        '200': { description: Nueva revisión guardada, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '409': { description: La revisión esperada ya no es actual, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: archiveStudioDesign
      responses:
        '200': { description: Diseño archivado sin borrar versiones ni exportaciones }
        '404': { $ref: '#/components/responses/NotFound' }
  /designs/{design}/template:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: saveStudioTemplate
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateCopy' }
      responses:
        '201': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/instantiate:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: instantiateStudioTemplate
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InstantiateTemplate' }
      responses:
        '201': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/resize:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: resizeStudioDesign
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResizeDesign' }
      responses:
        '200': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/apply-kit:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: applyStudioBrandKit
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExpectedRevision' }
      responses:
        '200': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/variants:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: createStudioVariants
      description: Requiere designs:write y revisión actual; no modifica el origen salvo resize/apply-kit. Todas las copias quedan en la misma marca.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DesignVariants' }
      responses:
        '201': { description: Operación completada con documento válido y revisión trazable, content: { application/json: { schema: { $ref: '#/components/schemas/DesignResults' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Revisión desactualizada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/duplicate:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: duplicateStudioDesign
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        '201': { description: Copia independiente, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /designs/{design}/restore:
    parameters:
      - $ref: '#/components/parameters/Design'
    post:
      operationId: restoreStudioDesign
      responses:
        '200': { description: Diseño restaurado, content: { application/json: { schema: { $ref: '#/components/schemas/Design' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-folders:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioFolders
      responses:
        '200':
          description: Carpetas de la marca; requiere designs:read
          content:
            application/json:
              schema:
                type: object
                required: [folders]
                properties:
                  folders: { type: array, items: { $ref: '#/components/schemas/DesignFolder' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createStudioFolder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201':
          description: Carpeta creada; requiere designs:write
          content:
            application/json:
              schema:
                type: object
                required: [folder]
                properties:
                  folder: { $ref: '#/components/schemas/DesignFolder' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-folders/{folder}:
    parameters:
      - name: folder
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    delete:
      operationId: deleteStudioFolder
      responses:
        '200':
          description: Carpeta eliminada; conserva diseños activos y archivados sin asociación; requiere designs:write
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/brand-kit:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getStudioBrandKit
      responses:
        '200': { description: Kit de la marca, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateStudioBrandKit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrandKit' }
      responses:
        '200': { description: Kit guardado, content: { application/json: { schema: { $ref: '#/components/schemas/BrandKit' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-assets:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioAssets
      responses:
        '200': { description: Recursos registrados en la marca; las URLs privadas se regeneran al consultar }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: attachStudioAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_id]
              properties:
                media_id: { type: integer, minimum: 1 }
      responses:
        '201': { description: Recurso propio listo registrado en la marca }
        '422': { $ref: '#/components/responses/ValidationError' }
  /designs/{design}/exports:
    parameters:
      - $ref: '#/components/parameters/Design'
    get:
      operationId: listStudioExports
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Historial paginado de trabajos y resultados de exportación
          content:
            application/json:
              schema:
                type: object
                required: [exports, pagination]
                properties:
                  exports: { type: array, items: { $ref: '#/components/schemas/Export' } }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: exportStudioDesign
      description: Exporta una revisión inmutable. MP4/GIF generan un archivo del proyecto con páginas en el orden indicado; frame_times no vacío y transparencia no se admiten para esos formatos. Los handlers audiovisuales del árbol de trabajo usan la cola studio; el diálogo del editor utiliza esos mismos trabajos y ofrece seguimiento y controles. La QA integral del padre T-11 sigue pendiente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, format, pages]
              properties:
                revision: { type: integer, minimum: 1 }
                format: { type: string, enum: [png, jpeg, webp, svg, pdf, mp4, gif] }
                pages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, maxLength: 64 }
                frame_times:
                  $ref: '#/components/schemas/FrameTimes'
                scale: { type: number, minimum: 0.1, maximum: 4, default: 1 }
                quality: { type: number, minimum: 0.1, maximum: 1, default: 0.94 }
                transparent: { type: boolean, default: false, description: Transparencia de formatos estáticos compatibles; MP4/GIF requieren false }
      responses:
        '202': { description: Trabajo de render aceptado, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-exports/{export}:
    parameters:
      - name: export
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getStudioExport
      responses:
        '200': { description: Estado y archivos realmente producidos, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /design-exports/{export}/cancel:
    parameters:
      - { name: export, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: cancelStudioExport
      description: Requiere designs:write y propiedad de exportación/marca. Cancela pending/processing audiovisual y señala su proceso; repetir cancelled es idempotente. Ready devuelve409 y conserva sus medios. Formatos estáticos devuelven422.
      responses:
        '200': { description: Estado cancelado sin aceptar respuestas tardías, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El resultado listo se conserva; no admite cancelación }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Cancelación registrada pero no se pudo señalizar el proceso; consultar estado y reintentar la señalización }
  /design-exports/{export}/retry:
    parameters:
      - { name: export, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: retryStudioExport
      description: Requiere designs:write y propiedad de exportación/marca. Solo failed/cancelled audiovisual; conserva revisión/opciones, crea generación nueva y valida los checkpoints antes de reutilizarlos. El ID público no cambia. Pending/processing/ready devuelve409; estáticos422.
      responses:
        '202': { description: Nueva generación aceptada, content: { application/json: { schema: { $ref: '#/components/schemas/Export' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: El estado actual no admite reintento }
        '422': { $ref: '#/components/responses/ValidationError' }
  /design-exports/{export}/post:
    parameters:
      - { name: export, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: createPostFromStudioExport
      description: Requiere designs:write y posts:write. Crea solo un borrador en la marca de la exportación propia ready, usando todos sus medios realmente listos. Nunca programa ni publica. SVG/PDF no son medios publicables.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: { type: string, nullable: true, maxLength: 100000 }
                targets: { type: array, items: { type: object } }
      responses:
        '201':
          description: Borrador propio creado sin publicar
          content:
            application/json:
              schema:
                type: object
                required: [post]
                properties:
                  post:
                    type: object
                    required: [id, status, edit_url]
                    properties:
                      id: { type: integer }
                      status: { type: string, enum: [borrador] }
                      edit_url: { type: string }
        '403': { description: Falta alguno de los permisos requeridos }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/analytics:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: getBrandAnalytics
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
        - name: network
          in: query
          schema: { type: string }
      responses:
        '200': { description: Métricas, comparación y cobertura compatibles con dashboard; nulos preservados }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-fonts:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioFonts
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Fuentes privadas de la marca y paginación, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontPage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: uploadStudioFont
      description: Requiere designs:write. Parsea bytes TTF/OTF/WOFF/WOFF2 y normaliza WOFF2 privado; máximo 8 MiB de entrada y 32 MiB sfnt declarado. No acepta URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file: { type: string, format: binary }
                name: { type: string, minLength: 1, maxLength: 255 }
      responses:
        '201': { description: Fuente validada y almacenada, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Ejecutor tipográfico no disponible }
  /brands/{brand}/design-fonts/{font}:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getStudioFont
      responses:
        '200': { description: Metadata privada sin rutas de disco, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteStudioFont
      description: Requiere designs:write. Una fuente referenciada por diseños, revisiones o kit no se elimina.
      responses:
        '204': { description: Fuente eliminada }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Fuente usada en un diseño, revisión o kit }
  /brands/{brand}/design-fonts/{font}/file:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: downloadStudioFont
      responses:
        '200': { description: Bytes WOFF2 privados, content: { font/woff2: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-fonts/{font}/archive:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: archiveStudioFont
      responses:
        '200': { description: Oculta en catálogo activo conservando bytes y referencias históricas, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-fonts/{font}/restore:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - { name: font, in: path, required: true, schema: { type: integer, minimum: 1 } }
    post:
      operationId: restoreStudioFont
      responses:
        '200': { description: Restaura visibilidad de una fuente archivada, content: { application/json: { schema: { $ref: '#/components/schemas/StudioFontResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/image-jobs:
    parameters:
      - $ref: '#/components/parameters/Brand'
    post:
      operationId: createStudioImageJob
      description: Requiere designs:write. Procesa una imagen propia registrada en la marca sin modificar el original. Modelo local verificado; no descarga ni ejecuta código remoto durante el job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [media_id, operation]
              properties:
                media_id: { type: integer, minimum: 1 }
                operation: { type: string, enum: [remove_background] }
      responses:
        '202': { description: Trabajo creado o trabajo activo equivalente recuperado, content: { application/json: { schema: { $ref: '#/components/schemas/StudioImageJobResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/image-jobs/{job}:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - name: job
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getStudioImageJob
      description: Requiere designs:read y propiedad del trabajo dentro de la marca.
      responses:
        '200': { description: Estado y recurso de salida privado cuando está listo, content: { application/json: { schema: { $ref: '#/components/schemas/StudioImageJobResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-audio:
    parameters:
      - $ref: '#/components/parameters/Brand'
    get:
      operationId: listStudioAudio
      description: Audio de la marca, diseños read; búsqueda por nombre y paginación.
      parameters:
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: per_page, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        '200': { description: Recursos de audio y paginación, content: { application/json: { schema: { type: object, properties: { assets: { type: array, items: { $ref: '#/components/schemas/StudioAudioAsset' } }, pagination: { type: object } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: startStudioAudioUpload
      description: designs:write. Inicia una subida binaria privada local o prefirmada single/multipart; no recibe base64 ni URLs de origen.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartStudioAudioUpload' }
      responses:
        '201': { description: Recurso pendiente y ticket de subida, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioUpload' } } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /brands/{brand}/design-audio/{media}:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - $ref: '#/components/parameters/Media'
    get:
      operationId: getStudioAudio
      description: designs:read; recurso de audio de la misma marca, incluido el estado pendiente o inválido.
      responses:
        '200': { description: Estado del audio, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands/{brand}/design-audio/{media}/upload:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - $ref: '#/components/parameters/Media'
    put:
      operationId: uploadStudioAudioLocal
      description: designs:write. Solo modo local, cuerpo binario acotado; sondeo real antes de ready. Una subida terminada no se sobrescribe.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { description: Audio sondeado y listo, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioResult' } } } }
        '409': { description: Subida ya terminada o concurrente }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Motor o preparación temporal no disponible; el archivo válido sigue pendiente para reintentar }
  /brands/{brand}/design-audio/{media}/complete:
    parameters:
      - $ref: '#/components/parameters/Brand'
      - $ref: '#/components/parameters/Media'
    post:
      operationId: completeStudioAudioUpload
      description: designs:write. Finaliza single/multipart, valida bytes/contenido/sondeo y devuelve el estado. Idempotente si ya está listo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                parts:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [number, etag]
                    properties:
                      number: { type: integer, minimum: 1, maximum: 10000 }
                      etag: { type: string, maxLength: 200 }
      responses:
        '200': { description: Audio validado, content: { application/json: { schema: { $ref: '#/components/schemas/StudioAudioResult' } } } }
        '409': { description: Finalización concurrente }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { description: Motor o copia privada no disponibles; la subida sigue pendiente }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Brand: { name: brand, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Design: { name: design, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Media: { name: media, in: path, required: true, schema: { type: integer, minimum: 1 } }
  responses:
    NotFound:
      description: Recurso inexistente o ajeno
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Documento, permiso de recurso o parámetros incompatibles
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    StudioDatasetColumn:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        label:
          type: "string"
          maxLength: 500
      required:
        - "id"
        - "label"
    StudioDatasetRow:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,64}$"
        values:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - {"type": "string", "maxLength": 10000}
              - {"type": "number"}
              - {"type": "string", "nullable": true, "enum": [null]}
      required:
        - "id"
        - "values"
    StudioDatasetTable:
      type: "object"
      additionalProperties: false
      properties:
        columns:
          type: "array"
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/StudioDatasetColumn"
        rows:
          type: "array"
          maxItems: 1000
          items:
            $ref: "#/components/schemas/StudioDatasetRow"
      required:
        - "columns"
        - "rows"
    StudioDataset:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "integer"
          minimum: 1
        brand_id:
          type: "integer"
          minimum: 1
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        revision:
          type: "integer"
          minimum: 1
        row_count:
          type: "integer"
          minimum: 0
          maximum: 1000
        column_count:
          type: "integer"
          minimum: 1
          maximum: 100
        archived_at:
          type: "string"
          format: "date-time"
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
        updated_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "brand_id"
        - "name"
        - "revision"
        - "row_count"
        - "column_count"
        - "archived_at"
        - "created_at"
        - "updated_at"
    StudioDatasetRevision:
      type: "object"
      additionalProperties: false
      properties:
        id:
          type: "integer"
          minimum: 1
        dataset_id:
          type: "integer"
          minimum: 1
        brand_id:
          type: "integer"
          minimum: 1
        revision:
          type: "integer"
          minimum: 1
        name:
          type: "string"
          maxLength: 255
        row_count:
          type: "integer"
          minimum: 0
          maximum: 1000
        column_count:
          type: "integer"
          minimum: 1
          maximum: 100
        sha256:
          type: "string"
          pattern: "^[a-f0-9]{64}$"
        json_bytes:
          type: "integer"
          minimum: 1
          maximum: 52000000
        created_at:
          type: "string"
          format: "date-time"
      required:
        - "id"
        - "dataset_id"
        - "brand_id"
        - "revision"
        - "name"
        - "row_count"
        - "column_count"
        - "sha256"
        - "json_bytes"
        - "created_at"
    StudioDatasetPagination:
      type: "object"
      additionalProperties: false
      properties:
        current_page:
          type: "integer"
          minimum: 1
        per_page:
          type: "integer"
          minimum: 1
          maximum: 100
        total:
          type: "integer"
          minimum: 0
        last_page:
          type: "integer"
          minimum: 1
        next_page:
          type: "integer"
          minimum: 1
          nullable: true
      required:
        - "current_page"
        - "per_page"
        - "total"
        - "last_page"
        - "next_page"
    StudioDatasetEnvelope:
      type: "object"
      additionalProperties: false
      properties:
        dataset:
          $ref: "#/components/schemas/StudioDataset"
      required:
        - "dataset"
    StudioDatasetList:
      type: "object"
      additionalProperties: false
      properties:
        datasets:
          type: "array"
          items:
            $ref: "#/components/schemas/StudioDataset"
        pagination:
          $ref: "#/components/schemas/StudioDatasetPagination"
      required:
        - "datasets"
        - "pagination"
    StudioDatasetRevisionList:
      type: "object"
      additionalProperties: false
      properties:
        revisions:
          type: "array"
          items:
            $ref: "#/components/schemas/StudioDatasetRevision"
        pagination:
          $ref: "#/components/schemas/StudioDatasetPagination"
      required:
        - "revisions"
        - "pagination"
    StudioDatasetCreate:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        table:
          $ref: "#/components/schemas/StudioDatasetTable"
      required:
        - "name"
        - "table"
    StudioDatasetReplace:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        table:
          $ref: "#/components/schemas/StudioDatasetTable"
        revision:
          type: "integer"
          minimum: 1
      required:
        - "name"
        - "table"
        - "revision"
    StudioDatasetFileCreate:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        format:
          type: "string"
          enum:
            - "csv"
            - "tsv"
            - "json"
        header:
          type: "boolean"
          default: true
        file:
          type: "string"
          format: "binary"
      required:
        - "name"
        - "format"
        - "file"
    StudioDatasetFileReplace:
      type: "object"
      additionalProperties: false
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        format:
          type: "string"
          enum:
            - "csv"
            - "tsv"
            - "json"
        header:
          type: "boolean"
          default: true
        file:
          type: "string"
          format: "binary"
        revision:
          type: "integer"
          minimum: 1
      required:
        - "name"
        - "format"
        - "file"
        - "revision"
    StudioDatasetRows:
      type: "object"
      additionalProperties: false
      properties:
        dataset:
          $ref: "#/components/schemas/StudioDataset"
        revision:
          type: "integer"
          minimum: 1
        sha256:
          type: "string"
          pattern: "^[a-f0-9]{64}$"
        columns:
          type: "array"
          items:
            $ref: "#/components/schemas/StudioDatasetColumn"
        rows:
          type: "array"
          maxItems: 100
          items:
            $ref: "#/components/schemas/StudioDatasetRow"
        pagination:
          type: "object"
          additionalProperties: false
          properties:
            offset:
              type: "integer"
              minimum: 0
              maximum: 1000
            limit:
              type: "integer"
              minimum: 1
              maximum: 100
            total:
              type: "integer"
              minimum: 0
              maximum: 1000
            next_offset:
              type: "integer"
              minimum: 0
              maximum: 1000
              nullable: true
          required:
            - "offset"
            - "limit"
            - "total"
            - "next_offset"
      required:
        - "dataset"
        - "revision"
        - "sha256"
        - "columns"
        - "rows"
        - "pagination"
    StartStudioAudioUpload:
      type: object
      additionalProperties: false
      required: [name, mime, size]
      properties:
        name: { type: string, maxLength: 255 }
        mime: { type: string, enum: [audio/mpeg, audio/wav, audio/x-wav, audio/mp4, audio/x-m4a, audio/aac, audio/ogg] }
        size: { type: integer, minimum: 1, maximum: 104857600 }
    StudioAudioAsset:
      type: object
      required: [id, name, kind, mime, size, status, duration, audio_codec, preview_url]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string }
        kind: { type: string, enum: [audio] }
        mime: { type: string }
        size: { type: integer }
        status: { type: string, enum: [pendiente, listo, invalido] }
        duration: { type: number, nullable: true, minimum: 0, maximum: 3600 }
        audio_codec: { type: string, nullable: true }
        preview_url: { type: string, nullable: true, description: Proxy privado de recursos de la misma marca; requiere designs:read en API }
    StudioAudioResult:
      type: object
      required: [asset]
      properties:
        asset: { $ref: '#/components/schemas/StudioAudioAsset' }
    StudioAudioUpload:
      type: object
      required: [asset, upload, complete_url]
      properties:
        asset: { $ref: '#/components/schemas/StudioAudioAsset' }
        upload:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [local, single, multipart] }
            url: { type: string }
            headers: { type: object, additionalProperties: { type: string } }
            part_size: { type: integer }
            parts: { type: array, items: { type: object } }
        complete_url: { type: string }
    StudioImageJobResult:
      type: object
      required: [job]
      properties:
        job: { $ref: '#/components/schemas/StudioImageJob' }
    StudioImageJob:
      type: object
      required: [id, brand_id, source_media_id, operation, status, model, model_sha256, output_asset, error, error_code]
      properties:
        id: { type: integer }
        brand_id: { type: integer }
        source_media_id: { type: integer }
        operation: { type: string, enum: [remove_background] }
        status: { type: string, enum: [queued, processing, ready, failed] }
        model: { type: string }
        model_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        output_asset: { type: object, nullable: true, description: Media privada lista de la misma marca con id y preview_url; dimensiones y PNG verificados por el servidor }
        error: { type: string, nullable: true }
        error_code: { type: string, nullable: true }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors: { type: object, additionalProperties: true }
    ElementTiming:
      type: object
      additionalProperties: false
      required: [start, duration]
      properties:
        start: { type: number, minimum: 0, maximum: 3600 }
        duration: { type: number, exclusiveMinimum: 0, maximum: 3600 }
    GainPoint:
      type: object
      additionalProperties: false
      required: [time, value]
      properties:
        time: { type: number, minimum: 0, maximum: 360000 }
        value: { type: number, minimum: 0, maximum: 1 }
    PageTransition:
      type: object
      additionalProperties: false
      required: [type, duration]
      properties:
        type: { type: string, enum: [cut, fade, slide_left, slide_right] }
        duration: { type: number, minimum: 0, maximum: 1800 }
    AudioTrack:
      type: object
      additionalProperties: false
      required: [id, asset_id, start, duration]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        asset_id: { type: integer, minimum: 1 }
        start: { type: number, minimum: 0, maximum: 360000 }
        duration: { type: number, exclusiveMinimum: 0, maximum: 360000 }
        trimStart: { type: number, minimum: 0, maximum: 86400 }
        trimEnd: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 86400 }
        sourceOffset: { type: number, minimum: 0, maximum: 86400 }
        playbackRate: { type: number, minimum: 0.25, maximum: 4 }
        loop: { type: boolean }
        volume: { type: number, minimum: 0, maximum: 1 }
        muted: { type: boolean }
        gainPoints:
          type: array
          minItems: 2
          maxItems: 64
          items: { $ref: '#/components/schemas/GainPoint' }
    CaptionCue:
      type: object
      additionalProperties: false
      required: [id, start, end, text]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
        start: { type: number, minimum: 0 }
        end: { type: number, minimum: 0 }
        text: { type: string, minLength: 1, maxLength: 500 }
    CaptionStyle:
      type: object
      additionalProperties: false
      properties:
        fontFamily: { type: string, maxLength: 100 }
        font_id: { type: integer, minimum: 1 }
        fontSize: { type: number, minimum: 1, maximum: 1000 }
        fontWeight: { type: string, enum: [normal, bold] }
        fontStyle: { type: string, enum: [normal, italic] }
        fill: { type: string, pattern: '^#[a-fA-F0-9]{6}$' }
        background: { type: string, pattern: '^#[a-fA-F0-9]{6}$' }
        stroke: { type: string, pattern: '^#[a-fA-F0-9]{6}$' }
        strokeWidth: { type: number, minimum: 0, maximum: 20 }
        textAlign: { type: string, enum: [left, center, right] }
        lineHeight: { type: number, minimum: 0.5, maximum: 5 }
        position: { type: string, enum: [top, center, bottom] }
        margin: { type: number, minimum: 0, maximum: 0.25 }
    Captions:
      type: object
      additionalProperties: false
      required: [style, cues]
      properties:
        style: { $ref: '#/components/schemas/CaptionStyle' }
        cues: { type: array, maxItems: 5000, items: { $ref: '#/components/schemas/CaptionCue' } }
    CaptionMutation:
      type: object
      additionalProperties: false
      required: [revision, action]
      properties:
        revision: { type: integer, minimum: 1 }
        action: { type: string, enum: [import, replace, upsert, delete, offset, style, clear] }
        activate_temporal: { type: boolean }
        format: { type: string, enum: [srt, vtt] }
        text: { type: string, description: UTF-8 input at most512KiB; plain text only }
        mode: { type: string, enum: [replace, append], default: append, description: Import adds cues by default; replace discards the previous track only when explicitly selected }
        captions: { $ref: '#/components/schemas/Captions' }
        cue: { $ref: '#/components/schemas/CaptionCue' }
        ids: { type: array, maxItems: 5000, items: { type: string } }
        seconds: { type: number }
        style: { $ref: '#/components/schemas/CaptionStyle' }
    Timeline:
      type: object
      additionalProperties: false
      required: [fps, audio_tracks]
      properties:
        captions: { $ref: '#/components/schemas/Captions' }
        fps: { type: integer, enum: [12, 15, 24, 25, 30, 50, 60] }
        audio_tracks:
          type: array
          maxItems: 64
          items: { $ref: '#/components/schemas/AudioTrack' }
    Document:
      type: object
      required: [schema_version, width, height, pages]
      properties:
        schema_version: { type: integer, enum: [1, 2] }
        timeline: { $ref: '#/components/schemas/Timeline' }
        width: { type: integer, minimum: 40, maximum: 8000 }
        height: { type: integer, minimum: 40, maximum: 8000 }
        pages:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [id, background, elements]
            properties:
              id: { type: string, maxLength: 64 }
              name: { type: string, maxLength: 255 }
              notes: { type: string, maxLength: 20000, description: 'Optional plain presenter notes; Unicode codepoints; whitespace and line endings preserved exactly.' }
              background: { oneOf: [{ type: string }, { type: object }] }
              duration: { type: number, minimum: 0.1, maximum: 3600 }
              transition: { $ref: '#/components/schemas/PageTransition' }
              elements:
                type: array
                maxItems: 500
                items:
                  type: object
                  required: [id, type, x, y, width, height]
                  properties:
                    id: { type: string, maxLength: 64 }
                    type: { type: string, enum: [text, rect, ellipse, triangle, line, path, image, video, group, chart] }
                    x: { type: number }
                    y: { type: number }
                    timing: { $ref: '#/components/schemas/ElementTiming' }
                    playbackRate: { type: number, minimum: 0.25, maximum: 4 }
                    sourceOffset: { type: number, minimum: 0, maximum: 86400 }
                    loop: { type: boolean }
                    gainPoints:
                      type: array
                      minItems: 2
                      maxItems: 64
                      items: { $ref: '#/components/schemas/GainPoint' }
                    width: { type: number, minimum: 0 }
                    height: { type: number, minimum: 0 }
                    asset_id: { type: integer, minimum: 1 }
                    chart: { $ref: '#/components/schemas/ChartSpec' }
                    elements: { type: array, items: { type: object } }
    CreateDesign:
      type: object
      required: [name, document]
      properties:
        name: { type: string, maxLength: 255 }
        document: { $ref: '#/components/schemas/Document' }
        folder_id: { type: integer, nullable: true, minimum: 1 }
        is_template: { type: boolean }
    UpdateDesign:
      allOf:
        - $ref: '#/components/schemas/CreateDesign'
        - type: object
          required: [revision]
          properties:
            revision: { type: integer, minimum: 1 }
            kit_revision: { type: integer, minimum: 1, description: Referencia opcional a una revisión existente del mismo diseño para restaurar la identidad junto al documento al deshacer; no acepta estilos arbitrarios }
    PaginationMeta:
      type: object
      required: [current_page, last_page, per_page, total, has_more]
      properties:
        current_page: { type: integer, minimum: 1 }
        last_page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
        has_more: { type: boolean }
    Design:
      allOf:
        - $ref: '#/components/schemas/CreateDesign'
        - type: object
          required: [id, brand_id, revision]
          properties:
            id: { type: integer }
            brand_id: { type: integer }
            revision: { type: integer, minimum: 1 }
            template_fields: { type: array, items: { type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]{0,63}$' }, description: Campos ASCII únicos ordenados encontrados en textos anidados; no se incluyen en el listado ligero }
            kit_reference: { type: object, nullable: true, description: Referencia de paleta/fuentes/logos al crear o aplicar el kit; no admite entradas del cliente }
            fonts: { type: array, items: { $ref: '#/components/schemas/StudioFont' }, description: Tipografías privadas usadas por el documento, incluidas las archivadas; URLs Bearer en API y MCP }
            exports: { type: array, items: { $ref: '#/components/schemas/Export' } }
            exports_pagination: { $ref: '#/components/schemas/PaginationMeta' }
    DesignFolder:
      type: object
      required: [id, brand_id, name]
      properties:
        id: { type: integer }
        brand_id: { type: integer }
        name: { type: string, maxLength: 255 }
    BrandKit:
      type: object
      properties:
        palette: { type: array, maxItems: 50, items: { type: string } }
        fonts: { type: array, maxItems: 50, items: { type: string, maxLength: 100 } }
        font_ids: { type: array, maxItems: 50, description: IDs opcionales alineados con fonts; null indica familia local, items: { type: integer, nullable: true, minimum: 1 } }
        logos: { type: array, maxItems: 30, items: { type: integer, minimum: 1 } }
        guidelines: { type: string, nullable: true, maxLength: 10000 }
        voice: { type: string, nullable: true, maxLength: 5000 }
    Export:
      type: object
      required: [id, design_id, revision, status, format]
      properties:
        id: { type: integer }
        design_id: { type: integer }
        revision: { type: integer }
        status: { type: string, enum: [pending, processing, ready, failed, cancelled] }
        format: { type: string, enum: [png, jpeg, webp, svg, pdf, mp4, gif] }
        pages: { type: array, items: { type: string } }
        media_ids: { type: array, nullable: true, items: { type: integer } }
        options: { type: object, nullable: true }
        error: { type: string, nullable: true }
        download_url: { type: string, nullable: true, description: URL firmada de descarga válida durante 10 minutos; null hasta disponer de artefacto listo }
        progress: { $ref: '#/components/schemas/ExportProgress' }
        can_cancel: { type: boolean, description: Solo audiovisual pending/processing }
        can_retry: { type: boolean, description: Solo audiovisual failed/cancelled }
    ExportProgress:
      type: object
      nullable: true
      description: Progreso por checkpoints aceptados de la generación actual; null en exportaciones estáticas. No contiene rutas, IDs privados de generación/lease, manifiestos ni perfiles PCM.
      required: [phase, completed, total, percent]
      properties:
        phase: { type: string, enum: [plan, verify, snapshot, normalize, render, mix, assemble, register, done, failed, cancelled] }
        completed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        percent: { type: number, minimum: 0, maximum: 100 }
    FrameTimes:
      type: array
      maxItems: 100
      description: Instantes locales por página para exportaciones estáticas de documento v2. Cada page_id debe estar seleccionado y aparecer una sola vez; time es finito, mayor o igual a cero y menor que la duración de esa página. Las páginas omitidas usan cero. No aplica transiciones entre páginas ni audio a formatos estáticos. Un documento v1 admite solamente una lista vacía o ausencia, conservando su póster anterior.
      items:
        type: object
        additionalProperties: false
        required: [page_id, time]
        properties:
          page_id: { type: string, minLength: 1, maxLength: 64 }
          time: { type: number, minimum: 0, maximum: 3600, exclusiveMaximum: true }
    ExpectedRevision:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
    TemplateCopy:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
    ResizeMode:
      type: string
      enum: [canvas, contain, cover]
      default: contain
      description: canvas cambia solo el lienzo; contain/cover escalan uniformemente los objetos raíz y centran, preservando grupos, tipografía, trayectorias y recortes.
    TemplateFields:
      type: object
      maxProperties: 100
      additionalProperties: { type: string, maxLength: 10000 }
      description: Todas y solo las claves ASCII de tokens {{key}} presentes en texto; sustitución literal simultánea, sin HTML ni evaluación recursiva. El texto final y el documento conservan sus límites.
    InstantiateTemplate:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
        fields: { $ref: '#/components/schemas/TemplateFields' }
        apply_brand_kit: { type: boolean, default: false }
        width: { type: integer, minimum: 40, maximum: 8000 }
        height: { type: integer, minimum: 40, maximum: 8000 }
        mode: { $ref: '#/components/schemas/ResizeMode' }
      description: Solo plantillas. width y height se proporcionan juntas o se omiten. Copia independiente sin modificar plantilla; IDs nuevos, revisión inicial 1. Kit aplica slots de referencia al actual; si no hay referencias usa primera aparición de colores/fuentes. Logos solo reemplazan IDs que eran logos. Kit vacío solicitado devuelve 422.
    ResizeDesign:
      type: object
      additionalProperties: false
      required: [revision, width, height]
      properties:
        revision: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 40, maximum: 8000 }
        height: { type: integer, minimum: 40, maximum: 8000 }
        mode: { $ref: '#/components/schemas/ResizeMode' }
    DesignVariant:
      type: object
      additionalProperties: false
      required: [width, height]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        width: { type: integer, minimum: 40, maximum: 8000 }
        height: { type: integer, minimum: 40, maximum: 8000 }
        mode: { $ref: '#/components/schemas/ResizeMode' }
    DesignVariants:
      type: object
      additionalProperties: false
      required: [revision, variants]
      properties:
        revision: { type: integer, minimum: 1 }
        fields: { $ref: '#/components/schemas/TemplateFields' }
        apply_brand_kit: { type: boolean, default: false }
        variants: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/DesignVariant' } }
      description: Variantes de diseño o plantilla; se exigen los campos presentes. Transacción total, máximo 12 documentos, 8 MiB UTF-8 acumulados y 20000 elementos acumulados. Fuente intacta, IDs independientes, revisión inicial 1, is_template false.
    DesignResult:
      type: object
      required: [design]
      properties:
        design: { $ref: '#/components/schemas/Design' }
    DesignResults:
      type: object
      required: [designs]
      properties:
        designs: { type: array, minItems: 1, maxItems: 12, items: { $ref: '#/components/schemas/Design' } }
    StudioFont:
      type: object
      required: [id, brand_id, name, family, style, weight, format, mime, size, sha256, status, archived_at, file_url, css_family]
      properties:
        id: { type: integer, minimum: 1 }
        brand_id: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 255 }
        family: { type: string, maxLength: 100 }
        style: { type: string, enum: [normal, italic] }
        weight: { type: integer, minimum: 100, maximum: 900 }
        format: { type: string, enum: [woff2] }
        mime: { type: string, enum: [font/woff2] }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        status: { type: string, enum: [ready] }
        archived_at: { type: string, format: date-time, nullable: true }
        file_url: { type: string, description: Ruta privada de esta superficie; API requiere bearer designs:read }
        css_family: { type: string, description: Familia interna StudioFont_ID_HASH16 independiente de nombres de otras marcas }
    StudioFontResult:
      type: object
      required: [font]
      properties:
        font: { $ref: '#/components/schemas/StudioFont' }
    StudioFontPage:
      type: object
      required: [fonts, pagination]
      properties:
        fonts: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/StudioFont' } }
        pagination:
          type: object
          required: [current_page, last_page, per_page, total, next_page]
          properties:
            current_page: { type: integer, minimum: 1 }
            last_page: { type: integer, minimum: 1 }
            per_page: { type: integer, minimum: 1, maximum: 100 }
            total: { type: integer, minimum: 0 }
            next_page: { type: integer, minimum: 1, nullable: true }

    ChartSpec:
      type: object
      additionalProperties: false
      required: [binding]
      description: Semantic chart configuration. Only references and typed options are persisted; no table or renderer JSON. Integration and AV acceptance are tracked in T12.
      properties:
        binding: { $ref: '#/components/schemas/ChartBinding' }
        options: { $ref: '#/components/schemas/ChartOptions' }
        style: { $ref: '#/components/schemas/ChartStyle' }
    ChartBinding:
      type: object
      additionalProperties: false
      required: [dataset, category_column, series_columns]
      properties:
        dataset:
          type: object
          additionalProperties: false
          required: [id, revision, sha256]
          properties:
            id: { type: integer, minimum: 1, maximum: 9007199254740991 }
            revision: { type: integer, minimum: 1, maximum: 9007199254740991 }
            sha256: { type: string, minLength: 64, maxLength: 64, pattern: '^[a-f0-9]{64}$' }
        category_column: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+(?![\s\S])' }
        series_columns:
          type: array
          minItems: 1
          maxItems: 12
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_-]+(?![\s\S])' }
        precision: { type: string, enum: [safe, approximate], default: safe }
    ChartOptions:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [bar, column, bar-grouped, column-grouped, bar-stacked, column-stacked, bar-proportional, column-proportional, bar-multicolor, column-multicolor] }
        band_gap: { type: number, minimum: 0, maximum: 0.9, default: 0.2 }
        series_gap: { type: number, minimum: 0, maximum: 0.9, default: 0.1 }
        palette: { type: array, minItems: 1, maxItems: 24, items: { type: string, pattern: '^#(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{4}|[a-fA-F0-9]{6}|[a-fA-F0-9]{8})(?![\s\S])' } }
        domain_min: { type: number, nullable: true, default: null }
        domain_max: { type: number, nullable: true, default: null }
        tick_count: { type: integer, minimum: 2, maximum: 21, default: 5 }
    ChartStyle:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 256, default: '' }
        subtitle: { type: string, maxLength: 256, default: '' }
        source: { type: string, maxLength: 256, default: '' }
        x_title: { type: string, maxLength: 256, default: '' }
        y_title: { type: string, maxLength: 256, default: '' }
        fontFamily: { type: string, minLength: 1, maxLength: 100, default: Arial }
        font_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
        fontSize: { type: number, minimum: 8, maximum: 72, default: 16 }
        fontWeight: { type: string, enum: [normal, bold], default: normal }
        fontStyle: { type: string, enum: [normal, italic], default: normal }
        text_color: { type: string, pattern: '^#(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{4}|[a-fA-F0-9]{6}|[a-fA-F0-9]{8})(?![\s\S])', default: '#111827' }
        axis_color: { type: string, pattern: '^#(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{4}|[a-fA-F0-9]{6}|[a-fA-F0-9]{8})(?![\s\S])', default: '#64748b' }
        grid_color: { type: string, pattern: '^#(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{4}|[a-fA-F0-9]{6}|[a-fA-F0-9]{8})(?![\s\S])', default: '#e2e8f0' }
        background: { type: string, pattern: '^#(?:[a-fA-F0-9]{3}|[a-fA-F0-9]{4}|[a-fA-F0-9]{6}|[a-fA-F0-9]{8})(?![\s\S])', default: '#ffffff' }
        legend: { type: boolean, default: true }
        show_grid: { type: boolean, default: true }
        show_axis: { type: boolean, default: true }
        category_labels: { type: boolean, default: true }
        legend_position: { type: string, enum: [bottom, right], default: bottom }
        value_labels: { type: string, enum: [none, raw, percentage], default: none }
        label_position: { type: string, enum: [inside, outside], default: outside }
        category_label_limit: { type: integer, minimum: 1, maximum: 80, default: 24 }
